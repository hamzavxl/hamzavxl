<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" role="img" aria-label="VXL — Security-Focused Fullstack and Backend Engineer">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c0e14"/>
      <stop offset="50%" stop-color="#090a0f"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>

    <!-- Vibrant Visor Crimson-Orange Gradient -->
    <linearGradient id="visorGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff3366"/>
      <stop offset="50%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#f7c844"/>
    </linearGradient>

    <!-- Cyber Cyan Accent Gradient -->
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <!-- Glowing Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .mono  { font-family: 'SFMono-Regular','Consolas','Liberation Mono','Courier New',monospace; }
      .lbl-red   { fill: #ff4d6d; font-weight: 700; }
      .lbl-cyan  { fill: #00d2ff; font-weight: 700; }
      .lbl-gold  { fill: #ffb703; font-weight: 700; }
      .val       { fill: #e2e8f0; }
      .cursor    { fill: #ff3366; animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <!-- Card Background -->
  <rect x="2" y="2" width="896" height="316" rx="16" fill="url(#bgGrad)" stroke="#1e2433" stroke-width="2"/>

  <!-- Ambient Grid Lines -->
  <g stroke="#141a26" stroke-width="1">
    <line x1="20" y1="120" x2="880" y2="120"/>
    <line x1="20" y1="205" x2="880" y2="205"/>
  </g>

  <!-- Top Terminal Bar -->
  <circle cx="34" cy="34" r="5.5" fill="#ff5f56"/>
  <circle cx="54" cy="34" r="5.5" fill="#ffbd2e"/>
  <circle cx="74" cy="34" r="5.5" fill="#27c93f"/>
  <text x="100" y="39" class="mono" font-size="13" fill="#64748b">vxl@root: ~/security-ops</text>
  <line x1="16" y1="56" x2="884" y2="56" stroke="#1a202c" stroke-width="1"/>

  <!-- Title & Handle -->
  <text x="48" y="136" class="mono" font-size="72" font-weight="900" fill="url(#visorGrad)" filter="url(#neonGlow)">VXL</text>
  <text x="210" y="136" class="mono" font-size="20" fill="#94a3b8">// Hamza</text>

  <!-- Role Subtitle -->
  <text x="48" y="174" class="mono" font-size="17" font-weight="600" fill="#f8fafc">&gt; Security-Focused Fullstack &amp; Backend Engineer</text>

  <!-- Tagline Quote -->
  <text x="48" y="198" class="mono" font-size="13.5" fill="#64748b" font-style="italic">// architecting hardened systems that are secure by design</text>

  <!-- Telemetry Info Rows -->
  <text x="48" y="242" class="mono" font-size="14">
    <tspan class="lbl-red">STACK  </tspan><tspan class="val"> : Python · Next.js · PostgreSQL · FastAPI · Express</tspan>
  </text>
  <text x="48" y="268" class="mono" font-size="14">
    <tspan class="lbl-cyan">FOCUS  </tspan><tspan class="val"> : Zero-Trust · Cryptographic Verification · Anti-Fraud</tspan>
  </text>
  <text x="48" y="294" class="mono" font-size="14">
    <tspan class="lbl-gold">REGION </tspan><tspan class="val"> : Algeria   |   </tspan><tspan class="lbl-cyan">HANDLE </tspan><tspan class="val"> : @hamzavxl </tspan><tspan class="cursor">_</tspan>
  </text>

  <!-- Glowing Cyber Security Shield (Right) -->
  <g transform="translate(705,88)" filter="url(#neonGlow)">
    <path d="M68 4 L132 28 V82 C132 125 102 148 68 160 C34 148 4 125 4 82 V28 Z"
          fill="rgba(255, 51, 102, 0.08)" stroke="url(#visorGrad)" stroke-width="2.5"/>
    <circle cx="68" cy="74" r="14" fill="none" stroke="#00f2fe" stroke-width="3"/>
    <path d="M68 82 L61 106 H75 Z" fill="#00f2fe"/>
    <path d="M42 46 L60 46 M42 60 L76 60" stroke="#334155" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  </g>
</svg>
